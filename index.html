<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 300px;
            background-color: #252526;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        .chat-list {
            flex: 1;
            overflow-y: auto;
        }
        .chat-item {
            padding: 15px;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }
        .chat-item:hover {
            background-color: #2a2d2e;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
        }
        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 60%;
            padding: 10px 15px;
            border-radius: 8px;
            word-break: break-word;
        }
        .incoming {
            background-color: #333;
            align-self: flex-start;
        }
        .outgoing {
            background-color: #007acc;
            align-self: flex-end;
        }
        .msg-time {
            font-size: 10px;
            color: #aaa;
            margin-top: 5px;
            text-align: right;
        }
        .message-form {
            display: flex;
            padding: 15px;
            background-color: #252526;
            border-top: 1px solid #333;
        }
        .message-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 4px;
            background-color: #3c3c3c;
            color: #fff;
            outline: none;
        }
        .send-btn {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .send-btn:hover {
            background-color: #005999;
        }
        .user-panel {
            padding: 15px;
            background-color: #2d2d2d;
            border-bottom: 1px solid #333;
        }
        .user-panel input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            background-color: #3c3c3c;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="user-panel">
            <input type="text" id="usernameInput" placeholder="Ваше имя...">
        </div>
        <div class="chat-list" id="chatList">
            <div class="chat-item" onclick="selectChat('Общий чат')">Общий чат</div>
        </div>
    </div>

    <div class="chat-area">
        <div class="messages-container" id="messagesContainer"></div>
        <form class="message-form" id="messageForm">
            <input type="text" class="message-input" id="messageInput" placeholder="Введите сообщение...">
            <button type="submit" class="send-btn">Отправить</button>
        </form>
    </div>

    <script>
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}`);

        let myUsername = "Гость";
        let activeChat = "Общий чат";
        const chatsData = { "Общий чат": [] };

        const usernameInput = document.getElementById('usernameInput');
        usernameInput.addEventListener('input', (e) => {
            myUsername = e.target.value.trim() || "Гость";
        });

        const messagesContainer = document.getElementById('messagesContainer');
        const messageForm = document.getElementById('messageForm');
        const messageInput = document.getElementById('messageInput');

        function renderMessages() {
            const messages = chatsData[activeChat] || [];
            messagesContainer.innerHTML = '';
            for (const msg of messages) {
                const div = document.createElement('div');
                div.className = `message ${msg.from === myUsername ? 'outgoing' : 'incoming'}`;
                div.innerHTML = `
                    <div style="font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #4ec9b0;">${msg.from}</div>
                    <div>${msg.text}</div>
                    <div class="msg-time">${msg.time}</div>
                `;
                messagesContainer.appendChild(div);
            }
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !activeChat) return;

            const messageData = {
                from: myUsername,
                recipient: activeChat,
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-02', minute: '2-digit' })
            };

            ws.send(JSON.stringify(messageData));
            messageInput.value = '';
        });

        ws.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);
                const targetChat = msg.recipient || "Общий чат";
                if (!chatsData[targetChat]) {
                    chatsData[targetChat] = [];
                }
                chatsData[targetChat].push(msg);
                renderMessages();
            } catch (err) {
                console.error("Ошибка при получении сообщения", err);
            }
        };

        function selectChat(chatName) {
            activeChat = chatName;
            if (!chatsData[activeChat]) {
                chatsData[activeChat] = [];
            }
            renderMessages();
        }
    </script>
</body>
</html>
